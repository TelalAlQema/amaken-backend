packages:
  - "packages/*"
overrides:
  # proxy-addr <2.0.8 mishandles IPv6 trust subnets with zero leading bits
  # (e.g. ::ffff:10.0.0.0/8), trusting every IPv4 client as a proxy.
  proxy-addr: 2.0.8

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: set this to true or false
  prisma: true
  sharp: true
